<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selectors</title>
    <style>
      #aws {
        color: brown;
      }

      .odd {
        background-color: blueviolet;
      }
      .even {
        background-color: green;
      }

      .special {
        font-style: italic;
      }

      h1 {
        background-color: grey;
      }

      * {
        background-color: greenyellow;
      }
    </style>
  </head>
  <body>
    <h1>We are learning CSS in web designing module</h1>

    <h3>List of courses</h3>

    <ul>
      <li>Full Stack</li>
      <li>Data scientist</li>
      <li>Data analyst</li>
      <li id="aws">AWS data engineer</li>
    </ul>

    <hr />

    <section>
      <form action="">
        <div>
          <label for="">Email:</label>
          <input type="email" name="" id="" />
        </div>

        <div>
          <label for="">Password</label>
          <input type="password" name="" id="" />
        </div>

        <div>
          <button type="reset">Reset</button>
          <button type="submit">Submit</button>
        </div>
      </form>
    </section>

    <hr />

    <h3>List of Numbers:</h3>
    <ul>
      <li class="odd">One</li>
      <li class="even">Two</li>
      <li class="odd">Three</li>
      <li class="even">Four</li>
      <li class="odd">Five</li>
      <li class="even special">Six</li>
      <li class="odd">Seven</li>
      <li class="even">Eight</li>
      <li class="odd">Nine</li>
      <li class="even">Ten</li>
    </ul>
  </body>
</html>
