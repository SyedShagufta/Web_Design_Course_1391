<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX PAGE</title>
</head>
<body>
    <h1>We are learning AJAX () in Javascript</h1>
    <p>It is a technique used to fast loading of response on web page without reloading the whole page</p>


</body>

<script>

    const xhr = new XMLHttpRequest();

        xhr.open('GET', 'https://fakestoreapi.com/products', true); // true for asynchronous

        xhr.onload = function() {

        if (xhr.status === 200) {

            console.log(xhr.responseText);

        } else {

            console.log('Request failed. Status:', xhr.status);

        }

        };

        xhr.onerror = function() {

        console.log('Request failed');

        };

        xhr.send();
</script>
</html>
